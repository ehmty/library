<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
</head>
<body>

    <button command="show-modal" commandfor="my-dialog" class="newBook-btn">New Book</button>

    <dialog id="my-dialog">

        <form method="dialog" id="book-form">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>

            <label for="author">Author</label>
            <input type="text" id="author" name="author" required>

            <label for="pages">Pages</label>
            <input type="number" id="pages" name="pages" min="1" required>

            <fieldset>
                <legend>Select one option</legend>
                <input type="radio" id="read" name="status" value="true">
                <label for="read">read</label>
                <input type="radio" id="not-read" name="status" value="false" checked>
                <label for="not-read">not read</label>
            </fieldset>
        </form>
        
        <input type="submit" form="book-form" name="submit" value="Add Book">
        <button commandfor="my-dialog" command="close">Close</button>

    </dialog>

    
    <table>
        <caption>Your books</caption>
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Pages</th>
                <th>Status</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            
        </tbody>
    </table>
    
</body>
</html>
